name: Publish browser demo
on:
  push:
    branches: [main, codex/event-checkin]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare the explicit single-browser demo
        shell: bash
        run: |
          mkdir -p _site
          cp public/index.html public/app.js public/demo.js public/domain.js public/styles.css public/theme.css public/favicon.svg _site/
          printf '{"mode":"demo"}\n' > _site/deployment.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
