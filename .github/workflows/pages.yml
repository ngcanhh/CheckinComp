name: Publish Study Break Night
on:
  push:
    branches: [main, codex/event-checkin]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: node --check pages/redirect.js
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare the shared website redirect
        shell: bash
        run: |
          mkdir -p _site
          cp pages/index.html pages/redirect.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
